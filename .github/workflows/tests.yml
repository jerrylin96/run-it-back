name: tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install torch first, then build torch-harmonics against it. Anything
        # after this step must respect the torch version that TH was compiled
        # with, otherwise the prebuilt _C.so will hit ABI-mismatch import errors.
        python -m pip install torch==2.7.1 --extra-index-url https://download.pytorch.org/whl/cpu
        python -m pip install setuptools_scm
        # PINNED to the same ref docker/makani.def builds into the cluster image (was @main;
        # an unpinned main is how the 2026-07-29 disco-kernels env-var rename slipped into
        # the image unnoticed). CPU build here is correct — no BUILD_CUDA on this runner.
        python -m pip install --no-build-isolation git+https://github.com/NVIDIA/torch-harmonics.git@v0.9.1
        # Freeze whatever torch version TH just compiled against. Strip the
        # local label (+cpu) so the constraint matches any build of that
        # public version.
        TH_TORCH=$(python -c "import torch; print(torch.__version__.split('+')[0])")
        echo "torch_harmonics was built against torch ${TH_TORCH}"
        echo "torch==${TH_TORCH}" > "${GITHUB_WORKSPACE}/constraints.txt"
        cat "${GITHUB_WORKSPACE}/constraints.txt"
        # Make the constraint visible to later workflow steps so physicsnemo
        # or any transitive dep can't silently upgrade torch and break TH's _C.so.
        echo "PIP_CONSTRAINT=${GITHUB_WORKSPACE}/constraints.txt" >> "$GITHUB_ENV"
        # Keep the CPU torch index visible to EVERY later pip invocation (same
        # pattern as PIP_CONSTRAINT above): if any step resolves a torch-adjacent
        # wheel (torchvision etc.) against PyPI alone, pip pulls the CUDA build
        # of the torch stack (~10 GB unpacked: nvidia-*-cu12, triton, ...) and
        # exhausts the runner disk — the Errno 28 failure of 2026-07-29.
        echo "PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu" >> "$GITHUB_ENV"
        # GITHUB_ENV only takes effect in LATER steps — export both guards for the
        # rest of THIS step too, since the physicsnemo install below already pulls
        # torch-adjacent deps (timm -> torchvision).
        export PIP_CONSTRAINT="${GITHUB_WORKSPACE}/constraints.txt"
        export PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
        # Pin physicsnemo to the git tag before installing the package so the
        # `nvidia-physicsnemo>=1.3.0,<2` dep in pyproject.toml resolves to this
        # build rather than whatever PyPI offers. v1.3.0 MUST (a) satisfy the
        # pyproject range — a lower pre-install is discarded and pip re-resolves
        # from PyPI (the 2026-07-29 disk blowup: unbounded >=1.3.0 resolved
        # physicsnemo 2.x, whose new torchvision dep dragged the CUDA torch
        # chain) — and (b) match docker/makani.def, so CI tests the same
        # physicsnemo the cluster image actually runs.
        python -m pip install git+https://github.com/NVIDIA/physicsnemo.git@v1.3.0
    - name: Install package
      run: |
        python -m pip install -e .[test,vis]
    - name: Install optional test dependencies
      run: |
        # WeatherBench2 is not on PyPI — install from source with --no-deps to
        # avoid pulling a numpy version that breaks the stack.
        # Note: NVIDIA DALI has no CPU-only wheel and requires CUDA runtime, so
        # DALI tests are skipped on this runner (guarded by skipUnless(_have_dali)).
        python -m pip install --no-deps git+https://github.com/google-research/weatherbench2.git
    - name: Test with pytest
      run: |
        python -m pytest -ra ./tests --cov=makani --cov-report=term-missing
